name: Android CI

# ----------------------------------------------------
# Trigger: Runs only when you push or create a PR
# to the "development" branch
# ----------------------------------------------------
on:
  push:
    branches: [ developement ]
  pull_request:
    branches: [ developement ]

jobs:
  build:
    # ------------------------------------------------
    # Use Ubuntu for Android build (default runner)
    # ------------------------------------------------
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------
      # 1️⃣ Checkout your code
      # ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # ------------------------------------------------
      # 2️⃣ Set up Node.js
      # (use your installed version — here Node 18)
      # ------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # ------------------------------------------------
      # 3️⃣ Set up Java (JDK 17 — required for Gradle)
      # ------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      # ------------------------------------------------
      # 4️⃣ Install dependencies
      # ------------------------------------------------
      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm install

      # ------------------------------------------------
      # 5️⃣ Clean Gradle build cache
      # ------------------------------------------------
      - name: Clean Gradle build
        run: |
          cd android
          ./gradlew clean

      # ------------------------------------------------
      # 6️⃣ Build Release APK
      # (Your signing config in build.gradle will be used)
      # ------------------------------------------------
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # ------------------------------------------------
      # 7️⃣ Upload APK as workflow artifact
      # (so you can download it from GitHub Actions page)
      # ------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

